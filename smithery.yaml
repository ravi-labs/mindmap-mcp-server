# Smithery configuration — https://smithery.ai/docs
# Mind Map is a local-first stdio MCP server published to npm; it needs no
# required configuration and works out of the box.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      mindmapDir:
        type: string
        title: Data directory
        description: Optional. Override where memories are stored (default ~/.mindmap).
    additionalProperties: false
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@ravi-labs/mindmap-mcp-server'],
      env: config && config.mindmapDir ? { MINDMAP_DIR: config.mindmapDir } : {}
    })
